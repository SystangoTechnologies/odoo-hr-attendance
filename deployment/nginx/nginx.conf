# Single Odoo upstream. All four repos' modules live in one instance, so there
# is no per-repo routing here -- and there must not be: Odoo does not support
# being served under a URL prefix.

upstream odoo {
    server odoo:8069;
}

# Odoo's websocket/longpolling worker. Only listening when workers >= 1.
upstream odoo_websocket {
    server odoo:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Odoo attachments and OCA report exports routinely exceed nginx's 1m default.
    client_max_body_size 200m;

    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;
    proxy_read_timeout    720s;

    gzip on;
    gzip_min_length 1100;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript image/svg+xml;

    # NOTE: nginx does not merge proxy_set_header across levels -- a location
    # that sets any of them drops all inherited ones. Every location below
    # therefore repeats the full set.

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /longpolling {
        proxy_pass http://odoo_websocket;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location ~* ^/web/(static|image|content)/ {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering on;
        expires 864000;
    }

    location / {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
